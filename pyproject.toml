[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-healthcare-backend"
version = "0.1.0"
description = "EVE Healthcare SDE Backend Service for Diagnostic Bookings and Payments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "redis>=5.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4"]
ignore = ["B008", "N802"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["F401", "E402", "E501"]
"app/models/__init__.py" = ["F401"]
